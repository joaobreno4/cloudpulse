apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudpulse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/joaobreno4/cloudpulse.git
    targetRevision: HEAD
    path: k8s/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudpulse

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
