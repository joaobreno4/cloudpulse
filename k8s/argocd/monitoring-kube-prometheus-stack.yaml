apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # CRDs do kube-prometheus-stack (ServiceMonitor, PrometheusRule, etc.) excedem o limite
    # de tamanho de anotações do kubectl apply padrão. ServerSideApply delega a fusão ao
    # API server, eliminando o erro "metadata.annotations: Too long".
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.1.1
    helm:
      values: |
        # Grafana já existe como Application standalone (monitoring-grafana.yaml).
        # Desabilitar aqui evita conflito de Service e credenciais duplicadas.
        grafana:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 24h
            # Sem PVC para dev local — usa emptyDir (dados perdidos ao restartar o pod)
            storageSpec: {}
            resources:
              requests:
                cpu: 100m
                memory: 200Mi
              limits:
                memory: 512Mi

        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                memory: 128Mi

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              memory: 128Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
            limits:
              memory: 64Mi

        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
