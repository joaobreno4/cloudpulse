apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-core-api
  namespace: cloudpulse
  labels:
    app: cloudpulse-core-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudpulse-core-api
  template:
    metadata:
      labels:
        app: cloudpulse-core-api
    spec:
      containers:
        - name: core-api
          image: cloudpulse-core-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5223
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres-db;Port=5432;Database=cloudpulse_db;Username=cloudpulse_user;Password=cloudpulse_password"
            - name: Neo4j__Uri
              value: bolt://neo4j-db:7687
            - name: Neo4j__Username
              value: neo4j
            - name: Neo4j__Password
              value: cloudpulse_password
            - name: DD_SERVICE
              value: cloudpulse-core-api
            - name: DD_ENV
              value: production
            - name: DD_VERSION
              value: "1.0.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 5223
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-core-api
  namespace: cloudpulse
spec:
  selector:
    app: cloudpulse-core-api
  ports:
    - port: 5223
      targetPort: 5223
  type: ClusterIP
