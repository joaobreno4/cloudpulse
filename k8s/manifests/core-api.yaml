apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-core-api
  namespace: cloudpulse
  labels:
    app: cloudpulse-core-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudpulse-core-api
  template:
    metadata:
      labels:
        app: cloudpulse-core-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-db -p 5432 -U cloudpulse_user; do
                echo "[init] aguardando postgres-db..."
                sleep 3
              done
              echo "[init] postgres-db pronto."

      containers:
        - name: core-api
          image: ghcr.io/joaobreno4/cloudpulse-core-api:dd418e0
          imagePullPolicy: Always
          ports:
            - containerPort: 5223
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres-db;Port=5432;Database=cloudpulse_db;Username=cloudpulse_user;Password=cloudpulse_password"
            - name: Neo4j__Uri
              value: bolt://neo4j-db:7687
            - name: Neo4j__Username
              value: neo4j
            - name: Neo4j__Password
              value: cloudpulse_password
            - name: DD_SERVICE
              value: cloudpulse-core-api
            - name: DD_ENV
              value: production
            - name: DD_VERSION
              value: "1.0.0"
          # /metrics é exposto pelo prometheus-net (app.UseMetricServer()) — endpoint garantido.
          # /health não existe no Program.cs; usar /health retornaria 404 e o pod nunca ficaria Ready.
          readinessProbe:
            httpGet:
              path: /metrics
              port: 5223
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 5223
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-core-api
  namespace: cloudpulse
spec:
  selector:
    app: cloudpulse-core-api
  ports:
    - port: 5223
      targetPort: 5223
  type: ClusterIP
