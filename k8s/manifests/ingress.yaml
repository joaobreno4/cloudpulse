apiVersion: v1
kind: Service
metadata:
  name: grafana-service-bridge
  namespace: cloudpulse
spec:
  ports:
    - port: 80
      targetPort: 3000 # Porta padrão do Grafana
---
apiVersion: v1
kind: Endpoints
metadata:
  name: grafana-service-bridge
  namespace: cloudpulse
subsets:
  - addresses:
      # Use o IP do cluster ou o nome DNS interno do service original do grafana
      - ip: 192.168.49.2 # Verifique o IP do seu Minikube com `minikube ip`
    ports:
      - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudpulse
  namespace: cloudpulse
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: cloudpulse.local
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: cloudpulse-core-api
            port:
              number: 5223
      - path: /grafana(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: grafana-service-bridge
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudpulse-frontend
            port:
              number: 80
