apiVersion: v1
kind: Service
metadata:
  name: grafana-service-bridge
  namespace: cloudpulse
spec:
  type: ExternalName
  externalName: kube-prometheus-stack-grafana.monitoring.svc.cluster.local
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudpulse
  namespace: cloudpulse
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: cloudpulse.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudpulse-core-api
                port:
                  number: 5223

          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana-service-bridge
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudpulse-frontend
                port:
                  number: 80
