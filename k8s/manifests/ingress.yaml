# Bridge cross-namespace para o Grafana (monitoring → cloudpulse).
# Aponta para o NodePort 32300 no IP do Minikube — não para a porta interna do pod (3000).
apiVersion: v1
kind: Service
metadata:
  name: grafana-service-bridge
  namespace: cloudpulse
spec:
  ports:
    - port: 80
      targetPort: 32300
---
apiVersion: v1
kind: Endpoints
metadata:
  name: grafana-service-bridge
  namespace: cloudpulse
subsets:
  - addresses:
      - ip: 192.168.49.2   # IP do nó Minikube — confirme com: minikube ip
    ports:
      - port: 32300         # NodePort do service grafana em monitoring (não a porta do pod)
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudpulse
  namespace: cloudpulse
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # SEM rewrite-target: o path é enviado ao backend intacto.
    # A API .NET tem [Route("api/[controller]")] — ela espera /api/Services, não /Services.
    # Qualquer rewrite que strip o prefixo /api causa 404 no .NET, não no Nginx.
spec:
  ingressClassName: nginx
  rules:
    - host: cloudpulse.local
      http:
        paths:
          # Prefix mais longo vence: /api (4 chars) ganha sobre / (1 char) para /api/*
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudpulse-core-api
                port:
                  number: 5223

          # /grafana via bridge NodePort — Grafana recebe /grafana/... intacto
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana-service-bridge
                port:
                  number: 80

          # Catch-all para o frontend — deve ficar por último
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudpulse-frontend
                port:
                  number: 80
