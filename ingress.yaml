apiVersion: v1
kind: Service
metadata:
  name: grafana-service-bridge
  namespace: cloudpulse
spec:
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: grafana-service-bridge
  namespace: cloudpulse
subsets:
  - addresses:
      - ip: 192.168.49.2 # Verifique com 'minikube ip'
    ports:
      - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudpulse
  namespace: cloudpulse
  annotations:
    # Removemos o rewrite-target para o .NET receber o path completo /api/...
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: cloudpulse.local
    http:
      paths:
      # O backend do .NET já espera o /api, então removemos o rewrite
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cloudpulse-core-api
            port:
              number: 5223
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana-service-bridge
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudpulse-frontend
            port:
              number: 80
