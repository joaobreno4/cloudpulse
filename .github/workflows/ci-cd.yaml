name: CI/CD — Build, Push & GitOps Update

on:
  push:
    branches: [main]
    # Impede loop infinito: o commit de atualização dos manifests não retrigga o pipeline
    paths-ignore:
      - 'k8s/manifests/**'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. CI — roda em PR e push para validar o código antes de qualquer build
  # ─────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/backend-core/CloudPulse.CoreAPI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build Release
        run: dotnet build --no-restore --configuration Release

  build-frontend:
    name: Build Node.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # 2. CD — build Docker + push GHCR (somente push para main)
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Build & Push Docker Images
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      owner: ${{ steps.owner.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Definir tag da imagem (short SHA)
        id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Normalizar owner para minúsculas (exigência do GHCR)
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN é gerado automaticamente pelo Actions — não precisa de segredo manual
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Core API ──────────────────────────────────────────────────────────
      - name: Build & Push — core-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend/backend-core/CloudPulse.CoreAPI
          file: ./backend/backend-core/CloudPulse.CoreAPI/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/cloudpulse-core-api:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/cloudpulse-core-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Build & Push — frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/cloudpulse-frontend:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/cloudpulse-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # 3. GitOps — atualiza os manifests com a nova tag para o ArgoCD detectar
  # ─────────────────────────────────────────────────────────────────────────
  update-manifests:
    name: Update K8s Manifests (GitOps)
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Usa o token padrão com permissão de push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar tag da imagem nos manifests
        env:
          TAG: ${{ needs.publish.outputs.image_tag }}
          OWNER: ${{ needs.publish.outputs.owner }}
        run: |
          sed -i "s|image: ghcr.io/.*/cloudpulse-core-api:.*|image: ghcr.io/${OWNER}/cloudpulse-core-api:${TAG}|" \
            k8s/manifests/core-api.yaml

          sed -i "s|image: ghcr.io/.*/cloudpulse-frontend:.*|image: ghcr.io/${OWNER}/cloudpulse-frontend:${TAG}|" \
            k8s/manifests/frontend.yaml

      - name: Commit e push dos manifests atualizados
        env:
          TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/manifests/core-api.yaml k8s/manifests/frontend.yaml
          git diff --cached --quiet && echo "Sem alterações nos manifests." && exit 0
          git commit -m "chore(gitops): bump images to ${TAG}"
          git push
